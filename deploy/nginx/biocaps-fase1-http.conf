# ============================================================================
# BioCaps Monitor® — Configuración de la FASE 1 (sólo HTTP)
#
# Se usa antes de tener el certificado: NGINX no puede arrancar con un bloque
# 443 que apunte a un certificado inexistente, y Certbot necesita que NGINX
# responda por el puerto 80 para validar el dominio.
#
# Esta configuración ya deja la aplicación funcionando: detrás de Cloudflare el
# visitante navega por HTTPS aunque el tramo hasta el servidor sea HTTP.
#
#   sudo cp deploy/nginx/biocaps-fase1-http.conf /etc/nginx/sites-available/biocaps
#   sudo ln -sf /etc/nginx/sites-available/biocaps /etc/nginx/sites-enabled/biocaps
#   sudo nginx -t && sudo systemctl reload nginx
#
# Una vez emitido el certificado, se sustituye por el nginx.conf de la raíz,
# que añade el bloque 443.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name biocaps.davant.dev;

    server_tokens off;
    client_max_body_size 10M;
    client_body_timeout 60s;

    access_log /var/log/nginx/biocaps.access.log;
    error_log  /var/log/nginx/biocaps.error.log warn;

    # Validación de Let's Encrypt. Cloudflare deja pasar esta ruta sin forzar
    # HTTPS, por eso funciona aunque el dominio esté proxiado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/biocaps-app.conf;
}
