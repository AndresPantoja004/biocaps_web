# ============================================================================
# BioCaps Monitor® — Configuración de la FASE 2 (certificado autofirmado)
#
# Paso intermedio necesario cuando Cloudflare está en modo SSL «Full»: en ese
# modo Cloudflare se conecta al origen SIEMPRE por HTTPS al puerto 443, incluso
# cuando el visitante —o Let's Encrypt— llega por HTTP al puerto 80.
#
# Sin un bloque 443 para este dominio, la petición cae en el sitio por defecto
# de otro proyecto y devuelve 404, y la validación de certbot nunca llega.
# Con un certificado autofirmado temporal se abre el 443, Cloudflare lo acepta
# (modo «Full» no verifica el certificado del origen) y el reto ACME sí llega.
#
#   sudo mkdir -p /etc/ssl/biocaps-temporal
#   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
#     -keyout /etc/ssl/biocaps-temporal/privkey.pem \
#     -out   /etc/ssl/biocaps-temporal/fullchain.pem \
#     -subj  '/CN=biocaps.davant.dev'
#
#   sudo cp deploy/nginx/biocaps-fase2-autofirmado.conf /etc/nginx/sites-available/biocaps
#   sudo nginx -t && sudo systemctl reload nginx
#
# Una vez emitido el certificado real se sustituye por el nginx.conf de la raíz.
#
# NOTA: si Cloudflare estuviera en «Full (strict)» rechazaría este certificado
# con un error 526. En ese caso hace falta acceso al panel para bajarlo a
# «Full» mientras se emite el certificado definitivo.
# ============================================================================

# ------------------------------- HTTP (puerto 80) -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name biocaps.davant.dev;

    server_tokens off;
    client_max_body_size 10M;

    access_log /var/log/nginx/biocaps.access.log;
    error_log  /var/log/nginx/biocaps.error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/biocaps-app.conf;
}

# ------------------------ HTTPS (puerto 443, temporal) ------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name biocaps.davant.dev;

    ssl_certificate     /etc/ssl/biocaps-temporal/fullchain.pem;
    ssl_certificate_key /etc/ssl/biocaps-temporal/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 10M;

    access_log /var/log/nginx/biocaps.access.log;
    error_log  /var/log/nginx/biocaps.error.log warn;

    # El reto de Let's Encrypt también se sirve aquí: en modo «Full» Cloudflare
    # reenvía por HTTPS incluso las peticiones que recibió por HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/biocaps-app.conf;
}
