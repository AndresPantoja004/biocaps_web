# ============================================================================
# BioCaps Monitor® — Directivas de contexto http
# Se instala en /etc/nginx/conf.d/biocaps-http.conf
#
# Estas directivas NO pueden ir dentro de un bloque server, por eso viven en un
# archivo aparte del sitio.
# ============================================================================

# Zona del limitador de intentos de acceso y registro, usada por el bloque
# location /api/auth/ del snippet de la aplicación.
limit_req_zone $binary_remote_addr zone=biocaps_auth:10m rate=10r/m;

# ----------------------------------------------------------------------------
# Protocolo real del visitante.
#
# Detrás de Cloudflare en modo «Flexible», el tramo Cloudflare → servidor es
# HTTP aunque el visitante navegue por HTTPS. Si pasáramos $scheme a la
# aplicación, ésta creería que la conexión es insegura. Cloudflare envía el
# protocolo original en X-Forwarded-Proto, así que se usa ése cuando existe y
# $scheme sólo como respaldo (acceso directo al servidor, sin proxy).
# ----------------------------------------------------------------------------
map $http_x_forwarded_proto $protocolo_visitante {
    default   $scheme;
    "http"    http;
    "https"   https;
}
