# ============================================================================
# BioCaps Monitor® — NGINX en contenedor (proxy inverso)
# Dominio: biocaps.davant.dev
#
# Se monta en el servicio "nginx" del docker-compose.yml (perfil "proxy").
# A diferencia de la versión para el host, aquí el destino es el nombre del
# servicio dentro de la red de Compose —biocaps:3000— y no 127.0.0.1, que
# dentro del contenedor de NGINX sería el propio NGINX.
# ============================================================================

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;

  # Resolución dinámica del contenedor de la aplicación: si "biocaps" se
  # reinicia y cambia de IP, NGINX no se queda con la dirección antigua.
  resolver 127.0.0.11 valid=30s ipv6=off;

  log_format biocaps '$remote_addr - $status "$request" '
                     '$body_bytes_sent "$http_referer" "$http_user_agent" '
                     'tiempo=$request_time';
  access_log /var/log/nginx/access.log biocaps;

  # ------------------------------ Compresión ------------------------------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1000;
  gzip_comp_level 6;
  gzip_types
      application/javascript
      application/json
      application/manifest+json
      image/svg+xml
      text/css
      text/plain
      text/xml;

  # Zona de limitación para el acceso y el registro de cuentas.
  limit_req_zone $binary_remote_addr zone=biocaps_auth:10m rate=10r/m;

  # Destino de la aplicación, en un solo sitio.
  upstream biocaps_app {
    server biocaps:3000;
    keepalive 16;
  }

  # Cabeceras del proxy reutilizadas por todos los bloques.
  proxy_http_version 1.1;
  proxy_set_header Connection        "";
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_connect_timeout 10s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # ---------------------- HTTP: reto ACME y redirección ----------------------
  server {
    listen 80;
    server_name biocaps.davant.dev;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ------------------------------ HTTPS: la app ------------------------------
  server {
    # `http2 on;` requiere NGINX 1.25.1 o superior; la imagen de este compose
    # la cumple. Con una versión anterior use: listen 443 ssl http2;
    listen 443 ssl;
    http2 on;
    server_name biocaps.davant.dev;

    ssl_certificate     /etc/letsencrypt/live/biocaps.davant.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biocaps.davant.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Subida de fotografías: la aplicación limita a 8 MB, se deja margen.
    client_max_body_size 10M;
    client_body_timeout 60s;

    # La aplicación ya envía X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy y HSTS. No se repiten aquí para no
    # duplicar cabeceras.

    location / {
      proxy_pass http://biocaps_app;
    }

    # Respuestas de la API: siempre frescas.
    location /api/ {
      proxy_pass http://biocaps_app;
      add_header Cache-Control "no-store" always;
    }

    # Freno adicional contra fuerza bruta en acceso y registro.
    location /api/auth/ {
      limit_req zone=biocaps_auth burst=20 nodelay;
      proxy_pass http://biocaps_app;
      add_header Cache-Control "no-store" always;
    }

    # --------------------------- Caché de estáticos ---------------------------
    # Sólo se marca "immutable" lo que nunca cambia de contenido bajo el mismo
    # nombre. El código de /js/ y /css/ NO lleva hash, así que se revalida en
    # cada carga: de lo contrario un despliegue nuevo tardaría días en llegar.

    location /vendor/ {
      proxy_pass http://biocaps_app;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Las fotografías se guardan como <marca-de-tiempo>-<hash>.<ext>: un archivo
    # jamás se reescribe, por eso se puede cachear un año.
    location /uploads/ {
      proxy_pass http://biocaps_app;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
      proxy_pass http://biocaps_app;
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
    }

    location ~* ^/(js|css)/ {
      proxy_pass http://biocaps_app;
      add_header Cache-Control "no-cache" always;
    }
  }
}
