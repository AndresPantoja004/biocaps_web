# ============================================================================
# BioCaps Monitor® — Reglas de proxy comunes a HTTP y HTTPS
#
# Se instala en /etc/nginx/snippets/biocaps-app.conf y lo incluyen los dos
# bloques server de sites-available/biocaps, para no duplicarlas.
#
# La aplicación escucha en 127.0.0.1:8090 (contenedor Docker).
# ============================================================================

# ------------------------ Aplicación (todo lo demás) ------------------------
# La aplicación ya emite X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy, Permissions-Policy y HSTS. No se repiten aquí para que el
# navegador no reciba cada cabecera dos veces.
location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Se conserva el protocolo que usó el visitante: detrás de Cloudflare llega
    # en la cabecera original aunque el tramo hasta aquí sea HTTP.
    proxy_set_header X-Forwarded-Proto $protocolo_visitante;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
}

# --------------------------------- API ---------------------------------
# Las respuestas cambian con cada muestreo registrado: nunca se cachean.
location /api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $protocolo_visitante;

    add_header Cache-Control "no-store" always;
    proxy_read_timeout 60s;
}

# Freno adicional contra fuerza bruta en el acceso y el registro de cuentas.
# (La aplicación ya limita por IP; esto lo detiene antes de llegar a Node.)
location /api/auth/ {
    limit_req zone=biocaps_auth burst=20 nodelay;

    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $protocolo_visitante;

    add_header Cache-Control "no-store" always;
}

# --------------------------- Caché de estáticos ---------------------------
#
# Sólo se marca "immutable" lo que nunca cambia de contenido bajo el mismo
# nombre:
#   /vendor/   Chart.js, Leaflet, jsPDF — cambian al reconstruir la imagen → 30 d
#   /uploads/  fotografías con marca de tiempo y hash: nunca se reescriben → 1 año
#   /assets/   logotipo; puede cambiar sin cambiar de nombre               → 7 días
#   /js/ /css/ código SIN hash en el nombre: se revalida siempre, para que un
#              despliegue nuevo llegue de inmediato y no días después.
#
location /vendor/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $protocolo_visitante;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $protocolo_visitante;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /assets/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $protocolo_visitante;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
}

# Express responde con ETag, así que la revalidación cuesta un 304 de pocos
# bytes. Sin esto, cada despliegue dejaría a los usuarios con el JavaScript
# antiguo durante días.
location ~* ^/(js|css)/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $protocolo_visitante;
    add_header Cache-Control "no-cache" always;
}
