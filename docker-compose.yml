# ============================================================================
# BioCaps Monitor® — Despliegue con Docker Compose
#
#   cp .env.example .env      y edite BIOCAPS_SECRET y BIOCAPS_URL
#   docker compose up -d --build
#   docker compose exec biocaps npm run seed     (datos de demostración)
#
# Con NGINX y HTTPS incluidos (dominio biocaps.davant.dev):
#   docker compose --profile proxy up -d --build
#   ./deploy/emitir-certificado.sh          (sólo la primera vez)
#
# Los datos viven en volúmenes: recrear el contenedor no los borra.
# ============================================================================

services:
  biocaps:
    build:
      context: .
      dockerfile: Dockerfile
    image: biocaps-monitor:1.0.0
    container_name: biocaps
    restart: unless-stopped

    # Las variables se leen del archivo .env; los valores de abajo son el
    # respaldo si alguna no está definida.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      BIOCAPS_DATA_DIR: /datos
      BIOCAPS_UPLOADS_DIR: /subidas
      # URL pública: se incrusta en los códigos QR de los reportes.
      BIOCAPS_URL: ${BIOCAPS_URL:-http://localhost:8080}
      # Secreto de firma de sesiones. Genérelo con:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      BIOCAPS_SECRET: ${BIOCAPS_SECRET:?defina BIOCAPS_SECRET en el archivo .env}
      BIOCAPS_REGISTRO_PUBLICO: ${BIOCAPS_REGISTRO_PUBLICO:-true}
      BIOCAPS_REGISTRO_APROBACION: ${BIOCAPS_REGISTRO_APROBACION:-false}
      BIOCAPS_TRAS_PROXY: ${BIOCAPS_TRAS_PROXY:-true}
      BIOCAPS_COOKIE_SEGURA: ${BIOCAPS_COOKIE_SEGURA:-false}
      BIOCAPS_SEMILLA_AUTO: ${BIOCAPS_SEMILLA_AUTO:-false}
      TZ: ${TZ:-America/Guayaquil}

    # Con el perfil "proxy" activo, NGINX llega a la aplicación por la red
    # interna de Compose y este puerto puede quedarse en 127.0.0.1 (o quitarse)
    # para que la aplicación no esté expuesta directamente a internet.
    ports:
      - "${BIOCAPS_BIND:-0.0.0.0}:${BIOCAPS_PUERTO:-8080}:3000"

    volumes:
      - biocaps_datos:/datos
      - biocaps_subidas:/subidas

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/salud"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Endurecimiento básico del contenedor.
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  # ==========================================================================
  # Proxy inverso con HTTPS. Se activa con:  docker compose --profile proxy up -d
  # Si ya tiene NGINX instalado en el host, NO use este perfil: utilice el
  # archivo nginx.conf de la raíz del proyecto.
  # ==========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: biocaps-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      biocaps:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certificados:/etc/letsencrypt:ro
      - certbot_reto:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Renovación automática del certificado. Certbot despierta cada 12 horas y
  # sólo renueva si faltan menos de 30 días para el vencimiento.
  certbot:
    image: certbot/certbot:latest
    container_name: biocaps-certbot
    restart: unless-stopped
    profiles: ["proxy"]
    volumes:
      - certbot_certificados:/etc/letsencrypt
      - certbot_reto:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done'

volumes:
  biocaps_datos:
    name: biocaps_datos
  biocaps_subidas:
    name: biocaps_subidas
  certbot_certificados:
    name: biocaps_certbot_certificados
  certbot_reto:
    name: biocaps_certbot_reto
