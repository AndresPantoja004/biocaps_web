# ============================================================================
# BioCaps Monitor® — NGINX como proxy inverso
# Dominio: biocaps.davant.dev  ·  detrás del proxy de Cloudflare
#
# Instalación (NGINX en el host):
#   sudo cp deploy/nginx/snippet-biocaps-app.conf /etc/nginx/snippets/biocaps-app.conf
#   sudo cp deploy/nginx/biocaps-http.conf        /etc/nginx/conf.d/biocaps-http.conf
#   sudo cp nginx.conf                            /etc/nginx/sites-available/biocaps
#   sudo ln -sf /etc/nginx/sites-available/biocaps /etc/nginx/sites-enabled/biocaps
#   sudo nginx -t && sudo systemctl reload nginx
#
# La aplicación escucha en 127.0.0.1:8090 (contenedor Docker).
#
# ¿Por qué el puerto 80 NO redirige a HTTPS?
#   Cloudflare ya obliga HTTPS en el borde. Si además redirigiéramos aquí y el
#   modo SSL del panel estuviera en «Flexible» —donde Cloudflare habla HTTP con
#   el origen— se produciría un bucle infinito: visitante → Cloudflare (HTTPS)
#   → origen (HTTP) → 301 a HTTPS → Cloudflare → origen (HTTP) → …
#   Sirviendo la aplicación en ambos puertos funciona en cualquier modo SSL.
#   Si algún día se deja de usar Cloudflare, active la redirección comentada
#   más abajo.
# ============================================================================

# ------------------------------- HTTP (puerto 80) -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name biocaps.davant.dev;

    server_tokens off;
    client_max_body_size 10M;
    client_body_timeout 60s;

    access_log /var/log/nginx/biocaps.access.log;
    error_log  /var/log/nginx/biocaps.error.log warn;

    # Validación de Let's Encrypt. Cloudflare deja pasar esta ruta sin forzar
    # HTTPS, por eso la renovación funciona aunque el dominio esté proxiado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Sin Cloudflare delante, descomente estas dos líneas y borre el include:
    # location / { return 301 https://$host$request_uri; }
    include /etc/nginx/snippets/biocaps-app.conf;
}

# ------------------------------ HTTPS (puerto 443) ------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name biocaps.davant.dev;

    # HTTP/2 no se declara aquí a propósito:
    #  · La directiva `http2 on;` sólo existe desde NGINX 1.25.1 y este servidor
    #    usa una versión anterior (fallaría con «unknown directive "http2"»).
    #  · La forma antigua, `listen 443 ssl http2;`, define opciones del socket:
    #    como otros sitios del servidor ya la declaran para el puerto 443,
    #    repetirla sólo produce el aviso «protocol options redefined».
    # En la práctica el puerto ya sirve HTTP/2 para todos los sitios.

    ssl_certificate     /etc/letsencrypt/live/biocaps.davant.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biocaps.davant.dev/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;

    # La aplicación limita la subida de fotografías a 8 MB; se deja margen para
    # la sobrecarga del formulario multipart.
    client_max_body_size 10M;
    client_body_timeout 60s;

    access_log /var/log/nginx/biocaps.access.log;
    error_log  /var/log/nginx/biocaps.error.log warn;

    include /etc/nginx/snippets/biocaps-app.conf;
}
