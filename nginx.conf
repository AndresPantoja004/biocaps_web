# ============================================================================
# BioCaps Monitor® — NGINX como proxy inverso
# Dominio: biocaps.davant.dev
#
# ESTA VERSIÓN ES PARA NGINX INSTALADO EN EL HOST, detrás de Cloudflare.
#   sudo cp nginx.conf /etc/nginx/sites-available/biocaps
#   sudo ln -s /etc/nginx/sites-available/biocaps /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# La aplicación escucha en 127.0.0.1:8090 (contenedor Docker).
#
# Requisitos en Cloudflare:
#   · Modo SSL/TLS en «Full» o «Full (strict)». En «Flexible» se produce un
#     bucle infinito de redirecciones, porque Cloudflare hablaría HTTP con el
#     origen y aquí el puerto 80 redirige a HTTPS.
#   · Ejecutar deploy/cloudflare-realip.sh para que NGINX registre la IP real
#     del visitante y no la de Cloudflare.
#
# Si prefiere NGINX en contenedor, use deploy/nginx/nginx.conf y el perfil
# "proxy" del docker-compose.yml (allí el destino es biocaps:3000).
# ============================================================================

# ------------------------- HTTP: sólo redirige a HTTPS -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name biocaps.davant.dev;

    # Certbot necesita servir el reto ACME por HTTP, sin redirección.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------- HTTPS: la app -------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name biocaps.davant.dev;

    # Certificado de origen de Cloudflare (válido 15 años, sin renovaciones).
    # El certificado que ve el visitante lo emite Cloudflare en el borde; este
    # sólo cifra el tramo Cloudflare → servidor, y requiere que el modo SSL del
    # panel esté en «Full» o «Full (strict)».
    #
    # Si algún día deja de usarse Cloudflare, sustituya estas dos rutas por las
    # de Let's Encrypt:
    #   /etc/letsencrypt/live/biocaps.davant.dev/fullchain.pem
    #   /etc/letsencrypt/live/biocaps.davant.dev/privkey.pem
    ssl_certificate     /etc/ssl/cloudflare/biocaps.davant.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/biocaps.davant.dev.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ssl_stapling queda desactivado a propósito: los certificados de origen de
    # Cloudflare no tienen respondedor OCSP y NGINX sólo emitiría advertencias.

    # Opcional (endurecimiento): aceptar únicamente conexiones que traigan el
    # certificado cliente de Cloudflare, de modo que nadie pueda saltarse el
    # proxy atacando la IP del servidor. Requiere activar «Authenticated Origin
    # Pulls» en el panel y descargar el certificado de Cloudflare:
    #   sudo curl -o /etc/ssl/cloudflare/origin-pull-ca.pem \
    #     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    server_tokens off;

    # La subida de fotografías del punto de muestreo está limitada a 8 MB en la
    # aplicación; se deja algo de margen para la sobrecarga del multipart.
    client_max_body_size 10M;
    client_body_timeout 60s;

    access_log /var/log/nginx/biocaps.access.log;
    error_log  /var/log/nginx/biocaps.error.log warn;

    # ------------------------------ Compresión ------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain
        text/xml;
    # text/html se comprime siempre; no hace falta declararlo.

    # ------------------------ Destino de la aplicación ------------------------
    # BioCaps NO usa WebSockets, por eso no se envían las cabeceras Upgrade.
    # La aplicación ya emite X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy y HSTS: no las repita aquí o el
    # navegador recibirá cada cabecera dos veces.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --------------------------------- API ---------------------------------
    # Las respuestas de la API cambian con cada muestreo registrado: nunca se
    # almacenan en caché.
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store" always;
        proxy_read_timeout 60s;
    }

    # Freno adicional contra fuerza bruta sobre el acceso y el registro.
    # (La aplicación ya limita por IP; esto lo detiene antes de llegar a Node.)
    location /api/auth/ {
        limit_req zone=biocaps_auth burst=20 nodelay;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store" always;
    }

    # --------------------------- Caché de estáticos ---------------------------
    #
    # Regla general: sólo se marca "immutable" lo que nunca cambia de contenido
    # bajo el mismo nombre.
    #
    #   /vendor/   Chart.js, Leaflet, jsPDF — sólo cambian al actualizar la
    #              dependencia y reconstruir la imagen.          → 30 días
    #   /uploads/  fotografías; el nombre incluye marca de tiempo y un hash
    #              aleatorio, así que un archivo nunca se reescribe. → 1 año
    #   /assets/   logotipo; puede cambiar sin cambiar de nombre.    → 7 días
    #   /js/ /css/ código de la aplicación SIN hash en el nombre: se revalida
    #              siempre para que un despliegue nuevo llegue de inmediato.
    #
    location /vendor/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Código de la aplicación: Express responde con ETag, así que la
    # revalidación devuelve un 304 de pocos bytes. Sin esto, cada despliegue
    # dejaría a los usuarios con el JavaScript antiguo hasta 30 días.
    location ~* ^/(js|css)/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
    }
}

# ============================================================================
# Este bloque va en el contexto http (por ejemplo en /etc/nginx/nginx.conf,
# dentro de http { … }), NO dentro de server. Define la zona usada arriba por
# limit_req en /api/auth/:
#
#   limit_req_zone $binary_remote_addr zone=biocaps_auth:10m rate=10r/m;
#
# Si su nginx.conf principal ya incluye conf.d/*.conf, puede crear el archivo
# /etc/nginx/conf.d/biocaps-limites.conf con esa única línea.
# ============================================================================
